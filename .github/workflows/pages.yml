name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["track-analyzer/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          cp track-analyzer/docs/GUIDE.html _site/track-analyzer.html
          echo '<!doctype html><meta charset="utf-8"><title>DJ tools</title><meta http-equiv="refresh" content="0; url=track-analyzer.html"><a href="track-analyzer.html">Track analyzer guide</a>' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
